<title>Wavetable Synth — Signal Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #cdd6f4;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.5rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.1rem;
    color: #89b4fa;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  svg {
    width: 100%;
    max-width: 820px;
    height: auto;
    overflow: visible;
  }

  /* node styles */
  .node-input    { fill: #1e1e2e; stroke: #45475a; }
  .node-alloc    { fill: #181825; stroke: #45475a; }
  .node-voice    { fill: #12121f; stroke: #313244; rx: 8; }
  .node-osc1     { fill: #1e3a5f; stroke: #89b4fa; }
  .node-osc2     { fill: #1a2e1a; stroke: #a6e3a1; }
  .node-blend    { fill: #1e1e2e; stroke: #45475a; }
  .node-adsr     { fill: #2e2a1a; stroke: #f9e2af; }
  .node-filter   { fill: #2a1a2e; stroke: #cba6f7; }
  .node-pan      { fill: #1a2a2e; stroke: #74c7ec; }
  .node-lfo      { fill: #2a1a3e; stroke: #cba6f7; }
  .node-sum      { fill: #1e1e2e; stroke: #45475a; }
  .node-clip     { fill: #2e1a1a; stroke: #f38ba8; }
  .node-out      { fill: #181825; stroke: #a6e3a1; }

  text { dominant-baseline: central; font-family: 'Courier New', monospace; }
  .lbl-main  { font-size: 11px; fill: #cdd6f4; font-weight: bold; }
  .lbl-sub   { font-size: 9px;  fill: #6c7086; }
  .lbl-val   { font-size: 8.5px; fill: #585b70; }
  .lbl-osc1  { fill: #89b4fa; }
  .lbl-osc2  { fill: #a6e3a1; }
  .lbl-adsr  { fill: #f9e2af; }
  .lbl-flt   { fill: #cba6f7; }
  .lbl-pan   { fill: #74c7ec; }
  .lbl-lfo   { fill: #cba6f7; }
  .lbl-clip  { fill: #f38ba8; }
  .lbl-out   { fill: #a6e3a1; }
  .lbl-input { fill: #45475a; }

  /* arrows */
  .arrow      { stroke: #45475a; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  .arrow-osc1 { stroke: #89b4fa44; stroke-width: 1.5; fill: none; marker-end: url(#arr-osc1); }
  .arrow-osc2 { stroke: #a6e3a144; stroke-width: 1.5; fill: none; marker-end: url(#arr-osc2); }
  .arrow-adsr { stroke: #f9e2af44; stroke-width: 1.5; fill: none; marker-end: url(#arr-adsr); }
  .arrow-flt  { stroke: #cba6f744; stroke-width: 1.5; fill: none; marker-end: url(#arr-flt); }
  .arrow-pan  { stroke: #74c7ec44; stroke-width: 1.5; fill: none; marker-end: url(#arr-pan); }
  .arrow-lfo  { stroke: #cba6f766; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#arr-lfo); }
  .arrow-out  { stroke: #a6e3a166; stroke-width: 1.5; fill: none; marker-end: url(#arr-out); }

  .section-label {
    font-size: 8px;
    fill: #313244;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
</style>

<svg viewBox="0 0 820 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr"      markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#45475a"/></marker>
    <marker id="arr-osc1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#89b4fa"/></marker>
    <marker id="arr-osc2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#a6e3a1"/></marker>
    <marker id="arr-adsr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#f9e2af"/></marker>
    <marker id="arr-flt"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#cba6f7"/></marker>
    <marker id="arr-pan"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#74c7ec"/></marker>
    <marker id="arr-lfo"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#cba6f7"/></marker>
    <marker id="arr-out"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#a6e3a1"/></marker>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background voice region ───────────────────────────────────────── -->
  <rect x="130" y="108" width="440" height="430" rx="10" fill="#12121f" stroke="#252535" stroke-width="1"/>
  <text x="350" y="124" text-anchor="middle" class="section-label">× 8 voices (independent)</text>

  <!-- ── LFO region ────────────────────────────────────────────────────── -->
  <rect x="595" y="175" width="140" height="300" rx="8" fill="#0e0e1c" stroke="#252535" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="665" y="191" text-anchor="middle" class="section-label">LFO modulation</text>

  <!-- ═══ INPUT BLOCK ═══════════════════════════════════════════════════ -->
  <!-- MIDI / Piano -->
  <rect x="12" y="20" width="100" height="34" rx="5" class="node-input"/>
  <text x="62" y="34" text-anchor="middle" class="lbl-main lbl-input">MIDI / Piano</text>
  <text x="62" y="47" text-anchor="middle" class="lbl-val">note_on(freq)</text>

  <!-- Freq slider -->
  <rect x="12" y="62" width="100" height="34" rx="5" class="node-input"/>
  <text x="62" y="76" text-anchor="middle" class="lbl-main lbl-input">Freq Slider</text>
  <text x="62" y="89" text-anchor="middle" class="lbl-val">change_freq()</text>

  <!-- ═══ VOICE ALLOCATOR ════════════════════════════════════════════════ -->
  <rect x="135" y="20" width="210" height="60" rx="6" class="node-alloc"/>
  <text x="240" y="40" text-anchor="middle" class="lbl-main">Voice Allocator</text>
  <text x="240" y="56" text-anchor="middle" class="lbl-sub">8 voices — prefer silent, steal oldest (min age)</text>
  <text x="240" y="70" text-anchor="middle" class="lbl-val">voice_counter tracks age; auto_release after 0.5 s</text>

  <!-- MIDI/Piano → allocator -->
  <line x1="112" y1="37" x2="133" y2="37" class="arrow"/>
  <!-- Freq → allocator -->
  <path d="M112,79 L124,79 L124,55 L133,55" class="arrow"/>

  <!-- ═══ OSC 1 ══════════════════════════════════════════════════════════ -->
  <rect x="145" y="138" width="200" height="68" rx="6" class="node-osc1" filter="url(#glow-blue)"/>
  <text x="245" y="156" text-anchor="middle" class="lbl-main lbl-osc1">Osc 1  — Unison copies</text>
  <text x="245" y="172" text-anchor="middle" class="lbl-sub">1–8 detuned copies · phase spread i/count</text>
  <text x="245" y="186" text-anchor="middle" class="lbl-val">cents_i = detune×(i/(n−1) − ½) · mip table · sinc LUT</text>
  <text x="245" y="198" text-anchor="middle" class="lbl-val">sum / count  →  osc1_out</text>

  <!-- allocator → osc1 (dashed vertical) -->
  <path d="M240,80 L240,136" class="arrow-osc1"/>

  <!-- ═══ OSC 2 ══════════════════════════════════════════════════════════ -->
  <rect x="145" y="218" width="200" height="54" rx="6" class="node-osc2"/>
  <text x="245" y="238" text-anchor="middle" class="lbl-main lbl-osc2">Osc 2</text>
  <text x="245" y="254" text-anchor="middle" class="lbl-sub">freq / detune_ratio · own waveform</text>
  <text x="245" y="266" text-anchor="middle" class="lbl-val">mip table · sinc LUT · pitch_scale</text>

  <!-- ═══ BLEND NODE ══════════════════════════════════════════════════════ -->
  <rect x="165" y="286" width="160" height="44" rx="5" class="node-blend"/>
  <text x="245" y="302" text-anchor="middle" class="lbl-main">(osc1 + osc2 × mix)</text>
  <text x="245" y="318" text-anchor="middle" class="lbl-val">÷ (1 + mix)  — constant amplitude</text>

  <!-- osc1 → blend -->
  <line x1="245" y1="206" x2="245" y2="218" class="arrow-osc1"/>
  <!-- osc2 → blend -->
  <line x1="245" y1="272" x2="245" y2="284" class="arrow-osc2"/>

  <!-- ═══ ADSR ══════════════════════════════════════════════════════════ -->
  <rect x="165" y="344" width="160" height="44" rx="5" class="node-adsr"/>
  <text x="245" y="362" text-anchor="middle" class="lbl-main lbl-adsr">ADSR Envelope</text>
  <text x="245" y="378" text-anchor="middle" class="lbl-val">× env.tick()  — Attack · Decay · Sustain · Release</text>

  <!-- blend → adsr -->
  <line x1="245" y1="330" x2="245" y2="342" class="arrow-adsr"/>

  <!-- ═══ FILTER ══════════════════════════════════════════════════════════ -->
  <rect x="165" y="402" width="160" height="44" rx="5" class="node-filter" filter="url(#glow-purple)"/>
  <text x="245" y="420" text-anchor="middle" class="lbl-main lbl-flt">Biquad Filter</text>
  <text x="245" y="436" text-anchor="middle" class="lbl-val">LP / HP / BP · per-voice state · Direct Form II T</text>

  <!-- adsr → filter -->
  <line x1="245" y1="388" x2="245" y2="400" class="arrow-flt"/>

  <!-- ═══ PAN ══════════════════════════════════════════════════════════ -->
  <rect x="165" y="460" width="160" height="44" rx="5" class="node-pan"/>
  <text x="245" y="477" text-anchor="middle" class="lbl-main lbl-pan">Stereo Pan</text>
  <text x="245" y="491" text-anchor="middle" class="lbl-val">pan_l = cos(θ) · pan_r = sin(θ) · θ=(pan+1)·π/4</text>
  <text x="245" y="503" text-anchor="middle" class="lbl-val">8 voices spread −spread … +spread</text>

  <!-- filter → pan -->
  <line x1="245" y1="446" x2="245" y2="458" class="arrow-pan"/>

  <!-- ═══ SUM / SOFT-CLIP / OUTPUT ════════════════════════════════════ -->
  <rect x="145" y="558" width="200" height="38" rx="5" class="node-sum"/>
  <text x="245" y="572" text-anchor="middle" class="lbl-main">Stereo Sum</text>
  <text x="245" y="588" text-anchor="middle" class="lbl-val">Σ (filtered × pan_l),  Σ (filtered × pan_r)  over 8 voices</text>

  <rect x="145" y="608" width="200" height="38" rx="5" class="node-clip"/>
  <text x="245" y="622" text-anchor="middle" class="lbl-main lbl-clip">Soft Clip</text>
  <text x="245" y="638" text-anchor="middle" class="lbl-val">tanh(sum × 0.3)  — graceful saturation</text>

  <!-- pan → sum  (exit bottom of voice box) -->
  <line x1="245" y1="504" x2="245" y2="556" class="arrow-pan"/>

  <!-- sum → clip -->
  <line x1="245" y1="596" x2="245" y2="606" class="arrow-out"/>

  <!-- ═══ OUTPUT CHANNELS ══════════════════════════════════════════════ -->
  <rect x="145" y="656" width="88" height="26" rx="4" class="node-out"/>
  <text x="189" y="669" text-anchor="middle" class="lbl-main lbl-out">get_left()</text>

  <rect x="257" y="656" width="88" height="26" rx="4" class="node-out"/>
  <text x="301" y="669" text-anchor="middle" class="lbl-main lbl-out">get_right()</text>

  <!-- clip → outputs -->
  <path d="M210,646 L189,654" class="arrow-out"/>
  <path d="M280,646 L301,654" class="arrow-out"/>

  <!-- ═══ LFO BLOCK ════════════════════════════════════════════════════ -->
  <rect x="604" y="200" width="122" height="50" rx="5" class="node-lfo" filter="url(#glow-purple)"/>
  <text x="665" y="218" text-anchor="middle" class="lbl-main lbl-lfo">LFO</text>
  <text x="665" y="234" text-anchor="middle" class="lbl-sub">Oscillator @ 0.01–20 Hz</text>
  <text x="665" y="247" text-anchor="middle" class="lbl-val">sine · shared across all voices</text>

  <!-- LFO → Pitch target (dashed) -->
  <rect x="604" y="268" width="122" height="38" rx="4" fill="#1e1a2e" stroke="#6c5090" stroke-width="1"/>
  <text x="665" y="282" text-anchor="middle" class="lbl-flt" style="font-size:9px">Pitch</text>
  <text x="665" y="297" text-anchor="middle" class="lbl-val">2^(lfo×d×2/12) → pitch_scale</text>

  <!-- LFO → Cutoff target -->
  <rect x="604" y="320" width="122" height="38" rx="4" fill="#1e1a2e" stroke="#6c5090" stroke-width="1"/>
  <text x="665" y="334" text-anchor="middle" class="lbl-flt" style="font-size:9px">Cutoff</text>
  <text x="665" y="349" text-anchor="middle" class="lbl-val">base_cutoff×2^(lfo×d×3)</text>

  <!-- LFO → Mix target -->
  <rect x="604" y="372" width="122" height="38" rx="4" fill="#1e1a2e" stroke="#6c5090" stroke-width="1"/>
  <text x="665" y="386" text-anchor="middle" class="lbl-flt" style="font-size:9px">Mix</text>
  <text x="665" y="401" text-anchor="middle" class="lbl-val">(osc2_mix + lfo×d).clamp(0,1)</text>

  <!-- LFO → target boxes -->
  <line x1="665" y1="250" x2="665" y2="266" class="arrow-lfo"/>
  <line x1="665" y1="306" x2="665" y2="318" class="arrow-lfo"/>
  <line x1="665" y1="358" x2="665" y2="370" class="arrow-lfo"/>

  <!-- Pitch → osc1 -->
  <path d="M604,287 L590,287 L590,172 L347,172" class="arrow-lfo"/>
  <!-- Pitch → osc2 (pitch_scale on osc2 too) -->
  <path d="M590,287 L590,245 L347,245" class="arrow-lfo"/>

  <!-- Cutoff → filter -->
  <path d="M604,339 L574,339 L574,424 L327,424" class="arrow-lfo"/>

  <!-- Mix → blend -->
  <path d="M604,391 L560,391 L560,308 L327,308" class="arrow-lfo"/>

  <!-- ═══ SPREAD LABEL ═════════════════════════════════════════════════ -->
  <text x="420" y="484" class="lbl-pan" style="font-size:9px">← Spread knob</text>
  <line x1="416" y1="482" x2="350" y2="482" class="arrow-pan" stroke-dasharray="3 2"/>

  <!-- ═══ LEGEND ═══════════════════════════════════════════════════════ -->
  <rect x="600" y="430" width="210" height="175" rx="6" fill="#12121f" stroke="#252535" stroke-width="1"/>
  <text x="705" y="449" text-anchor="middle" class="section-label">legend</text>

  <!-- signal flow -->
  <line x1="615" y1="465" x2="645" y2="465" stroke="#89b4fa" stroke-width="2"/>
  <text x="652" y="465" class="lbl-osc1" style="font-size:9px">Osc 1 signal</text>
  <line x1="615" y1="482" x2="645" y2="482" stroke="#a6e3a1" stroke-width="2"/>
  <text x="652" y="482" class="lbl-osc2" style="font-size:9px">Osc 2 signal</text>
  <line x1="615" y1="499" x2="645" y2="499" stroke="#f9e2af" stroke-width="2"/>
  <text x="652" y="499" class="lbl-adsr" style="font-size:9px">Envelope</text>
  <line x1="615" y1="516" x2="645" y2="516" stroke="#cba6f7" stroke-width="2"/>
  <text x="652" y="516" class="lbl-flt" style="font-size:9px">Filter</text>
  <line x1="615" y1="533" x2="645" y2="533" stroke="#74c7ec" stroke-width="2"/>
  <text x="652" y="533" class="lbl-pan" style="font-size:9px">Stereo pan</text>
  <line x1="615" y1="550" x2="645" y2="550" stroke="#a6e3a1" stroke-width="2"/>
  <text x="652" y="550" class="lbl-out" style="font-size:9px">Output</text>
  <line x1="615" y1="568" x2="645" y2="568" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="652" y="568" class="lbl-lfo" style="font-size:9px">LFO modulation</text>
  <line x1="615" y1="585" x2="645" y2="585" stroke="#45475a" stroke-width="1.5"/>
  <text x="652" y="585" class="lbl-input" style="font-size:9px">Control / data</text>

  <!-- "one of 8" bracket hint -->
  <line x1="575" y1="138" x2="575" y2="538" stroke="#252535" stroke-width="1"/>
  <line x1="570" y1="138" x2="580" y2="138" stroke="#252535" stroke-width="1"/>
  <line x1="570" y1="538" x2="580" y2="538" stroke="#252535" stroke-width="1"/>
  <text x="588" y="338" class="section-label" transform="rotate(90,588,338)">× 8 voices</text>
</svg>
