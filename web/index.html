<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavetable Synth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #cdd6f4;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #89b4fa;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #status {
      font-size: 0.75rem;
      color: #6c7086;
      letter-spacing: 0.05em;
    }

    .panel {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      width: 100%;
      max-width: 720px;
    }

    .two-col {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 720px;
    }

    .two-col > .panel {
      flex: 1;
      min-width: 0;
      width: auto;
      max-width: none;
    }

    .panel-title {
      font-size: 0.65rem;
      color: #585b70;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
    }

    /* Waveform + oscilloscope row */
    .wf-osc {
      display: flex;
      gap: 0.75rem;
      align-items: stretch;
    }

    .wf-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .wf-btn {
      padding: 0.3rem 0.6rem;
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 4px;
      color: #a6adc8;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .wf-btn:hover { background: #313244; color: #cdd6f4; }

    .wf-btn.active {
      background: #1e3a5f;
      border-color: #89b4fa;
      color: #89b4fa;
      font-weight: bold;
    }

    #scope {
      display: block;
      flex: 1;
      min-height: 70px;
      border-radius: 4px;
      background: #11111b;
    }

    #wf-draw {
      display: none;
      width: 100%;
      height: 80px;
      background: #11111b;
      border-radius: 4px;
      margin-top: 0.6rem;
      cursor: crosshair;
      touch-action: none;
    }

    #wf-draw.active { display: block; }

    /* Filter panel */
    .flt-row {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .flt-type-btn {
      width: 3.4rem;
      height: 3.4rem;
      background: #1e1e2e;
      border: 2px solid #45475a;
      border-radius: 50%;
      color: #cba6f7;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: border-color 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }

    .flt-type-btn:hover {
      border-color: #cba6f7;
      box-shadow: 0 0 10px #cba6f744;
    }

    .flt-knobs {
      display: flex;
      gap: 2rem;
    }

    .knob-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .knob-canvas {
      width: 54px;
      height: 54px;
      cursor: ns-resize;
      display: block;
    }

    .knob-label {
      font-size: 0.6rem;
      color: #585b70;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .knob-val {
      font-size: 0.68rem;
      color: #cba6f7;
    }

    #flt-scope {
      display: block;
      width: 100%;
      height: 90px;
      background: #11111b;
      border-radius: 4px;
      margin-top: 0.75rem;
    }

    /* Frequency panel */
    .freq-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .freq-hz {
      font-size: 1.1rem;
      color: #89b4fa;
      white-space: nowrap;
    }

    .freq-note {
      font-size: 0.75rem;
      color: #6c7086;
      white-space: nowrap;
    }

    #freq-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #313244;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    #freq-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #89b4fa;
      border-radius: 50%;
      border: 2px solid #0f0f1a;
      box-shadow: 0 0 8px #89b4fa66;
    }

    #freq-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #89b4fa;
      border-radius: 50%;
      border: 2px solid #0f0f1a;
    }

    .freq-range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #45475a;
      margin-top: 0.4rem;
    }

    /* ADSR canvas */
    #adsr-canvas {
      display: block;
      width: 100%;
      height: 140px;
      border-radius: 4px;
      background: #11111b;
      cursor: default;
    }

    .adsr-vals {
      display: flex;
      justify-content: space-around;
      margin-top: 0.6rem;
      font-size: 0.7rem;
      color: #585b70;
    }

    .adsr-vals span { text-align: center; }
    .adsr-vals b { display: block; font-weight: normal; }

    /* Piano */
    .piano-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      overflow-x: auto;
    }


    .piano {
      position: relative;
      display: flex;
      user-select: none;
      touch-action: none;
    }

    .white-key {
      width: 28px;
      height: 100px;
      background: linear-gradient(to bottom, #e8e8e8, #f5f5f5);
      border: 1px solid #aaa;
      border-top: none;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: background 0.05s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .white-key:hover { background: linear-gradient(to bottom, #d0deff, #e4ebff); }
    .white-key.active { background: linear-gradient(to bottom, #93c0ff, #b8d4ff); }

    .key-label {
      font-size: 0.6rem;
      color: #888;
      font-family: 'Courier New', monospace;
      pointer-events: none;
    }

    .white-key.active .key-label { color: #2255aa; }

    .black-key {
      position: absolute;
      width: 17px;
      height: 58px;
      background: linear-gradient(to bottom, #222, #333);
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      z-index: 2;
      top: 0;
      transition: background 0.05s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }

    .black-key:hover { background: linear-gradient(to bottom, #334, #445); }
    .black-key.active { background: linear-gradient(to bottom, #2255aa, #3366cc); }

    .black-key .key-label { color: #666; font-size: 0.55rem; }
    .black-key.active .key-label { color: #aaccff; }

    .note-display {
      font-size: 0.8rem;
      color: #89b4fa;
      letter-spacing: 0.05em;
      min-height: 1.2rem;
      text-align: center;
    }

    .key-hint {
      font-size: 0.65rem;
      color: #45475a;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Wavetable Synth</h1>
  <p id="status">Click a key to start audio...</p>

  <div class="panel">
    <div class="panel-title">Waveform &amp; Oscilloscope</div>
    <div class="wf-osc">
      <div class="wf-buttons">
        <button class="wf-btn active" data-idx="0">Sine</button>
        <button class="wf-btn"        data-idx="1">Sawtooth</button>
        <button class="wf-btn"        data-idx="2">Square</button>
        <button class="wf-btn"        data-idx="3">Triangle</button>
        <button class="wf-btn"        data-idx="4">Pulse</button>
        <button class="wf-btn"        data-idx="5">Organ</button>
        <button class="wf-btn"        data-idx="6">Additive</button>
        <button class="wf-btn"        data-idx="7">Custom</button>
      </div>
      <canvas id="scope"></canvas>
    </div>
    <canvas id="wf-draw"></canvas>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-title">ADSR Envelope — drag handles to edit</div>
      <canvas id="adsr-canvas"></canvas>
      <div class="adsr-vals">
        <span>A<b id="av">10ms</b></span>
        <span>D<b id="dv">150ms</b></span>
        <span>S<b id="sv">70%</b></span>
        <span>R<b id="rv">400ms</b></span>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Filter</div>
      <div class="flt-row">
        <div class="knob-wrap">
          <button class="flt-type-btn" id="flt-type">LP</button>
          <span class="knob-label">Type</span>
        </div>
        <div class="flt-knobs">
          <div class="knob-wrap">
            <canvas class="knob-canvas" id="flt-cutoff-knob"></canvas>
            <span class="knob-label">Cutoff</span>
            <span class="knob-val" id="flt-cutoff-val">20 kHz</span>
          </div>
          <div class="knob-wrap">
            <canvas class="knob-canvas" id="flt-res-knob"></canvas>
            <span class="knob-label">Resonance</span>
            <span class="knob-val" id="flt-res-val">0.71</span>
          </div>
        </div>
      </div>
      <canvas id="flt-scope"></canvas>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Keyboard — C2 to C7</div>
    <div class="piano-wrap">
      <div class="piano" id="piano"></div>
    </div>
    <div class="note-display" id="note-display"></div>
    <div class="key-hint">A W S E D F T G Y H U J K → C4–C5</div>
  </div>

  <div class="panel">
    <div class="panel-title">Frequency</div>
    <div class="freq-row">
      <span class="freq-hz" id="freq-hz">440.0 Hz</span>
      <span class="freq-note" id="freq-note">A4</span>
    </div>
    <input type="range" id="freq-slider" min="0" max="1000" value="500">
    <div class="freq-range-labels"><span>20 Hz</span><span>4000 Hz</span></div>
  </div>

  <script type="module">
    import init, { Synth } from './pkg/rust_wavetable.js';

    // ── Piano layout (C2–C7, 5 octaves) ────────────────────────────────
    const NOTE_NAMES  = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const WHITE_SEMI  = new Set([0, 2, 4, 5, 7, 9, 11]);
    const PIANO_START = 36;  // C2
    const PIANO_END   = 96;  // C7
    const WW = 28, BW = 17;  // white / black key widths (px)

    const isWhite = m => WHITE_SEMI.has(m % 12);
    function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function midiName(m) { return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1); }

    // Keyboard shortcuts fixed at C4–C5
    const KEY_MAP = { 'a':60,'w':61,'s':62,'e':63,'d':64,'f':65,'t':66,'g':67,'y':68,'h':69,'u':70,'j':71,'k':72 };
    function labelFor(midi) {
      for (const [k, v] of Object.entries(KEY_MAP)) if (v === midi) return k.toUpperCase();
      return '';
    }

    // Build ordered white-key list (with pixel index)
    const pianoWhite = [], pianoBlack = [];
    let wi = 0;
    for (let m = PIANO_START; m <= PIANO_END; m++) {
      if (isWhite(m)) pianoWhite.push({ midi: m, wi: wi++ });
    }
    for (let m = PIANO_START; m <= PIANO_END; m++) {
      if (!isWhite(m)) {
        const rightW = pianoWhite.find(w => w.midi > m);
        if (rightW) pianoBlack.push({ midi: m, left: rightW.wi * WW - BW / 2 });
      }
    }

    // ── Build piano DOM ─────────────────────────────────────────────────
    const pianoEl = document.getElementById('piano');
    pianoEl.style.width = (pianoWhite.length * WW) + 'px';

    pianoWhite.forEach(k => {
      const el = document.createElement('div');
      el.className = 'white-key';
      el.dataset.midi = k.midi;
      el.innerHTML = `<span class="key-label">${labelFor(k.midi)}</span>`;
      pianoEl.appendChild(el);
    });

    pianoBlack.forEach(k => {
      const el = document.createElement('div');
      el.className = 'black-key';
      el.dataset.midi = k.midi;
      el.style.left = k.left + 'px';
      el.innerHTML = `<span class="key-label">${labelFor(k.midi)}</span>`;
      pianoEl.appendChild(el);
    });

    // ── Frequency slider (logarithmic: 20 Hz – 4000 Hz) ────────────────
    const FREQ_MIN = 20, FREQ_MAX = 4000;

    function sliderToFreq(v) {
      return FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, v / 1000);
    }

    function freqToSlider(f) {
      return Math.round(1000 * Math.log(f / FREQ_MIN) / Math.log(FREQ_MAX / FREQ_MIN));
    }

    function freqToNoteName(freq) {
      const midi  = Math.round(12 * Math.log2(freq / 440) + 69);
      const exact = 440 * Math.pow(2, (midi - 69) / 12);
      const cents = Math.round(1200 * Math.log2(freq / exact));
      const name  = NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
      return cents === 0 ? name : `${name} ${cents > 0 ? '+' : ''}${cents}¢`;
    }

    function setFreqDisplay(freq) {
      document.getElementById('freq-hz').textContent   = freq.toFixed(1) + ' Hz';
      document.getElementById('freq-note').textContent = freqToNoteName(freq);
    }

    function syncSliderToFreq(freq) {
      document.getElementById('freq-slider').value = freqToSlider(freq);
      setFreqDisplay(freq);
    }

    // Initialise slider to A4
    syncSliderToFreq(440);

    document.getElementById('freq-slider').addEventListener('input', e => {
      const freq = sliderToFreq(parseInt(e.target.value));
      currentFreq = freq;
      setFreqDisplay(freq);
      startAudio().then(() => { if (synth) synth.change_freq(freq); });
    });

    // ── Waveform shapes (for oscilloscope preview) ───────────────────────
    const WAVE_FNS = [
      t => Math.sin(2 * Math.PI * t),
      t => 2 * t - 1,
      t => t < 0.5 ? 1 : -1,
      t => 1 - 4 * Math.abs(t - 0.5),
      t => t < 0.25 ? 1 : -1,
      t => (Math.sin(2*Math.PI*t) + Math.sin(4*Math.PI*t)*0.5 + Math.sin(6*Math.PI*t)*0.25 + Math.sin(8*Math.PI*t)*0.125) / 1.875,
      t => { const v = Math.sin(2*Math.PI*t) + Math.sin(6*Math.PI*t)/3 + Math.sin(10*Math.PI*t)/5; return Math.max(-1, Math.min(1, v/0.867)); },
    ];

    let activeWave = 0;
    let isPlaying = false;
    let scopeOffset = 0;
    let currentFreq = 440;
    let customDrawValues = null;
    let customTableLoaded = false;
    const drawCanvas = document.getElementById('wf-draw');

    // ── Oscilloscope ────────────────────────────────────────────────────
    const scopeCanvas = document.getElementById('scope');
    const scopeCtx = scopeCanvas.getContext('2d');

    function drawScope() {
      const W = scopeCanvas.offsetWidth;
      const H = scopeCanvas.offsetHeight;
      if (scopeCanvas.width !== W || scopeCanvas.height !== H) {
        scopeCanvas.width = W;
        scopeCanvas.height = H;
      }

      scopeCtx.fillStyle = '#11111b';
      scopeCtx.fillRect(0, 0, W, H);

      // centre line
      scopeCtx.strokeStyle = '#1e1e2e';
      scopeCtx.lineWidth = 1;
      scopeCtx.beginPath();
      scopeCtx.moveTo(0, H / 2);
      scopeCtx.lineTo(W, H / 2);
      scopeCtx.stroke();

      // waveform — cycles scale with frequency so pitch changes are visible
      scopeCtx.strokeStyle = isPlaying ? '#89b4fa' : '#585b70';
      scopeCtx.lineWidth = 2;
      scopeCtx.beginPath();
      const cycles = 1 + 14 * (Math.log2(Math.max(20, currentFreq)) - Math.log2(20)) / (Math.log2(4000) - Math.log2(20));
      for (let x = 0; x <= W; x++) {
        const t = ((x / W) * cycles + scopeOffset) % 1;
        let amp;
      if (activeWave === 7 && customDrawValues) {
        const pos = t * customDrawValues.length;
        const ci = Math.floor(pos) % customDrawValues.length;
        amp = customDrawValues[ci] + (pos % 1) * (customDrawValues[(ci+1) % customDrawValues.length] - customDrawValues[ci]);
      } else {
        amp = WAVE_FNS[Math.min(activeWave, 6)](t);
      }
        const y = H / 2 - amp * (H / 2 - 6);
        x === 0 ? scopeCtx.moveTo(x, y) : scopeCtx.lineTo(x, y);
      }
      scopeCtx.stroke();

      if (isPlaying) scopeOffset = (scopeOffset + 0.004) % 1;
      requestAnimationFrame(drawScope);
    }
    drawScope();

    // ── Audio engine ────────────────────────────────────────────────────
    let synth = null;
    let audioCtx = null;
    let processor = null;
    const statusEl = document.getElementById('status');
    const noteDisplay = document.getElementById('note-display');

    async function startAudio() {
      if (audioCtx) return;
      statusEl.textContent = 'Loading WASM...';
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
      await init();
      synth = new Synth(audioCtx.sampleRate);

      // ScriptProcessorNode — calls into WASM for each sample
      processor = audioCtx.createScriptProcessor(256, 0, 1);
      processor.onaudioprocess = e => {
        const out = e.outputBuffer.getChannelData(0);
        for (let i = 0; i < out.length; i++) out[i] = synth.tick();
      };
      processor.connect(audioCtx.destination);
      statusEl.textContent = 'Ready';
    }

    // ── Key interaction ─────────────────────────────────────────────────
    const activeNotes = new Set();        // all currently held MIDI notes
    const pointerToNote = new Map();      // pointerId → midi (multi-touch)

    function noteOn(midi) {
      startAudio().then(() => {
        if (!synth) return;
        activeNotes.add(midi);
        const freq = midiFreq(midi);
        synth.note_on(freq);
        isPlaying = true;
        currentFreq = freq;
        syncSliderToFreq(freq);
        noteDisplay.textContent = `${midiName(midi)}  ·  ${freq.toFixed(1)} Hz`;
        document.querySelectorAll(`[data-midi="${midi}"]`).forEach(el => el.classList.add('active'));
      });
    }

    function noteOff(midi) {
      if (!activeNotes.has(midi)) return;
      activeNotes.delete(midi);
      if (synth) synth.note_off(midiFreq(midi));
      if (activeNotes.size === 0) { isPlaying = false; noteDisplay.textContent = ''; }
      document.querySelectorAll(`[data-midi="${midi}"]`).forEach(el => el.classList.remove('active'));
    }

    // Piano pointer events — setPointerCapture handles multi-touch correctly
    pianoEl.addEventListener('pointerdown', e => {
      const key = e.target.closest('[data-midi]');
      if (!key) return;
      e.preventDefault();
      key.setPointerCapture(e.pointerId);
      const midi = parseInt(key.dataset.midi);
      pointerToNote.set(e.pointerId, midi);
      noteOn(midi);
    });

    const releasePointer = e => {
      const midi = pointerToNote.get(e.pointerId);
      if (midi !== undefined) { noteOff(midi); pointerToNote.delete(e.pointerId); }
    };
    pianoEl.addEventListener('pointerup', releasePointer);
    pianoEl.addEventListener('pointercancel', releasePointer);

    // Keyboard events
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      const midi = KEY_MAP[e.key.toLowerCase()];
      if (midi === undefined) return;
      noteOn(midi);
    });

    document.addEventListener('keyup', e => {
      const midi = KEY_MAP[e.key.toLowerCase()];
      if (midi === undefined) return;
      noteOff(midi);
    });

    // ── Waveform buttons ────────────────────────────────────────────────
    document.querySelectorAll('.wf-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        activeWave = idx;
        document.querySelectorAll('.wf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (idx === 7) {
          drawCanvas.classList.add('active');
          initDrawCanvas(); renderDrawCanvas();
          if (customTableLoaded && synth) synth.set_waveform(7);
        } else {
          drawCanvas.classList.remove('active');
          if (synth) synth.set_waveform(idx);
        }
      });
    });

    // ── Custom wavetable draw ────────────────────────────────────────────
    const drawCtx = drawCanvas.getContext('2d');
    let isDrawing = false, lastDrawX = null;

    function initDrawCanvas() {
      const W = drawCanvas.offsetWidth || 512;
      if (!customDrawValues || customDrawValues.length !== W) {
        customDrawValues = new Float32Array(W);
      }
    }

    function renderDrawCanvas() {
      initDrawCanvas();
      const W = drawCanvas.offsetWidth || 512, H = drawCanvas.offsetHeight;
      const dpr = window.devicePixelRatio || 1;
      if (drawCanvas.width !== Math.round(W * dpr)) {
        drawCanvas.width  = Math.round(W * dpr);
        drawCanvas.height = Math.round(H * dpr);
        drawCtx.scale(dpr, dpr);
      }
      drawCtx.clearRect(0, 0, W, H);
      drawCtx.fillStyle = '#11111b'; drawCtx.fillRect(0, 0, W, H);
      drawCtx.strokeStyle = '#2a2a3e'; drawCtx.lineWidth = 1;
      drawCtx.beginPath(); drawCtx.moveTo(0, H/2); drawCtx.lineTo(W, H/2); drawCtx.stroke();

      if (customDrawValues.every(v => v === 0)) {
        drawCtx.fillStyle = '#45475a'; drawCtx.font = '11px Courier New'; drawCtx.textAlign = 'center';
        drawCtx.fillText('drag to draw a waveform', W/2, H/2 - 6);
      } else {
        drawCtx.strokeStyle = '#a6e3a1'; drawCtx.lineWidth = 2;
        drawCtx.beginPath();
        for (let x = 0; x < W; x++) {
          const y = H/2 - customDrawValues[x] * (H/2 - 4);
          x === 0 ? drawCtx.moveTo(0, y) : drawCtx.lineTo(x, y);
        }
        drawCtx.stroke();
      }
    }

    function applyDraw(mx, my) {
      initDrawCanvas();
      const W = drawCanvas.offsetWidth || 512, H = drawCanvas.offsetHeight;
      const x = Math.max(0, Math.min(W - 1, Math.round(mx)));
      const amp = Math.max(-1, Math.min(1, -(my - H/2) / (H/2 - 4)));
      if (lastDrawX !== null && Math.abs(x - lastDrawX) > 1) {
        const y0 = customDrawValues[lastDrawX], steps = Math.abs(x - lastDrawX), dir = x > lastDrawX ? 1 : -1;
        for (let i = 0; i <= steps; i++) {
          const xi = lastDrawX + i * dir;
          if (xi >= 0 && xi < W) customDrawValues[xi] = y0 + (amp - y0) * (i / steps);
        }
      } else { customDrawValues[x] = amp; }
      lastDrawX = x;
      renderDrawCanvas();
    }

    function sendCustomToSynth() {
      if (!customDrawValues) return;
      const W = customDrawValues.length, N = 2048;
      const resampled = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const x = (i / N) * W;
        const x0 = Math.floor(x) % W, x1 = (x0 + 1) % W, frac = x - Math.floor(x);
        resampled[i] = customDrawValues[x0] + frac * (customDrawValues[x1] - customDrawValues[x0]);
      }
      startAudio().then(() => {
        if (synth) { synth.load_custom_table(resampled); customTableLoaded = true; activeWave = 7; }
      });
    }

    drawCanvas.addEventListener('mousedown', e => {
      isDrawing = true; lastDrawX = null; e.preventDefault();
      const r = drawCanvas.getBoundingClientRect();
      applyDraw((e.clientX-r.left)*(drawCanvas.offsetWidth/r.width), (e.clientY-r.top)*(drawCanvas.offsetHeight/r.height));
    });
    window.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      const r = drawCanvas.getBoundingClientRect();
      applyDraw((e.clientX-r.left)*(drawCanvas.offsetWidth/r.width), (e.clientY-r.top)*(drawCanvas.offsetHeight/r.height));
    });
    window.addEventListener('mouseup', () => {
      if (isDrawing) { isDrawing = false; lastDrawX = null; sendCustomToSynth(); }
    });
    drawCanvas.addEventListener('touchstart', e => {
      isDrawing = true; lastDrawX = null; e.preventDefault();
      const r = drawCanvas.getBoundingClientRect(), t = e.touches[0];
      applyDraw((t.clientX-r.left)*(drawCanvas.offsetWidth/r.width), (t.clientY-r.top)*(drawCanvas.offsetHeight/r.height));
    }, { passive: false });
    drawCanvas.addEventListener('touchmove', e => {
      if (!isDrawing) return; e.preventDefault();
      const r = drawCanvas.getBoundingClientRect(), t = e.touches[0];
      applyDraw((t.clientX-r.left)*(drawCanvas.offsetWidth/r.width), (t.clientY-r.top)*(drawCanvas.offsetHeight/r.height));
    }, { passive: false });
    drawCanvas.addEventListener('touchend', () => {
      if (isDrawing) { isDrawing = false; lastDrawX = null; sendCustomToSynth(); }
    });

    // ── ADSR interactive canvas ─────────────────────────────────────────
    const adsrCanvas = document.getElementById('adsr-canvas');
    const adsrCtx = adsrCanvas.getContext('2d');

    // Current ADSR state (ms / 0-1 level)
    const env = {
      attack:  { ms: 10,  max: 2000, min: 5 },
      decay:   { ms: 150, max: 3000, min: 5 },
      sustain: { level: 0.7 },
      release: { ms: 400, max: 5000, min: 5 },
    };

    // sqrt scale → short values stay easy to grab
    function toT(ms, max)      { return Math.sqrt(ms / max); }
    function fromT(t, max, min){ return Math.max(min, Math.round(t * t * max)); }

    // CSS-pixel layout (width adapts, height is fixed)
    function layout() {
      const W = adsrCanvas.offsetWidth;
      const H = 140;
      const px = 14, py = 22;
      const usable = W - 2 * px;
      const seg = usable / 4;
      return {
        W, H, px, py,
        top: py, bot: H - py, seg,
        xA: px,             // attack seg start
        xB: px + seg,       // decay  seg start
        xC: px + seg * 2,   // hold   seg start  (note-off line)
        xD: px + seg * 3,   // release seg start
        xE: px + seg * 4,   // end
      };
    }

    // The three draggable handle positions (CSS px)
    function handles(L) {
      const amp = L.bot - L.top;
      return {
        p1: { x: L.xA + toT(env.attack.ms,  env.attack.max)  * L.seg, y: L.top,                                     id: 'attack',        color: '#a6e3a1' },
        p2: { x: L.xB + toT(env.decay.ms,   env.decay.max)   * L.seg, y: L.top + (1 - env.sustain.level) * amp,     id: 'decay+sustain', color: '#f9e2af' },
        p4: { x: L.xD + toT(env.release.ms, env.release.max) * L.seg, y: L.bot,                                     id: 'release',       color: '#f38ba8' },
      };
    }

    let adsrHover = null, adsrDrag = null;

    function drawADSR() {
      const L = layout();
      // Resize backing buffer to match CSS size × DPR
      const dpr = window.devicePixelRatio || 1;
      if (adsrCanvas.width !== Math.round(L.W * dpr)) {
        adsrCanvas.width  = Math.round(L.W * dpr);
        adsrCanvas.height = Math.round(L.H * dpr);
        adsrCtx.scale(dpr, dpr);
      }

      const { p1, p2, p4 } = handles(L);
      const p0 = { x: L.xA, y: L.bot };
      const p3 = { x: L.xC, y: p2.y  }; // note-off = start of release

      adsrCtx.clearRect(0, 0, L.W, L.H);
      adsrCtx.fillStyle = '#11111b';
      adsrCtx.fillRect(0, 0, L.W, L.H);

      // Segment tint bands
      const bands = ['#a6e3a108','#f9e2af08','#cba6f708','#f38ba808'];
      bands.forEach((c, i) => {
        adsrCtx.fillStyle = c;
        adsrCtx.fillRect(L.xA + L.seg * i, L.top - 4, L.seg, L.bot - L.top + 8);
      });

      // Segment labels (top)
      const lbls = [['A','#a6e3a1'],['D','#f9e2af'],['S','#cba6f7'],['R','#f38ba8']];
      adsrCtx.font = '10px Courier New';
      adsrCtx.textAlign = 'center';
      lbls.forEach(([t, c], i) => {
        adsrCtx.fillStyle = c;
        adsrCtx.fillText(t, L.xA + L.seg * i + L.seg / 2, L.top - 8);
      });

      // Segment dividers
      adsrCtx.strokeStyle = '#2a2a3e';
      adsrCtx.lineWidth = 1;
      [L.xB, L.xC, L.xD].forEach(x => {
        adsrCtx.beginPath();
        adsrCtx.moveTo(x, L.top - 4);
        adsrCtx.lineTo(x, L.bot + 4);
        adsrCtx.stroke();
      });

      // Note-off marker (dashed, at xC)
      adsrCtx.setLineDash([3, 4]);
      adsrCtx.strokeStyle = '#45475a';
      adsrCtx.lineWidth = 1;
      adsrCtx.beginPath();
      adsrCtx.moveTo(L.xC, L.top - 4);
      adsrCtx.lineTo(L.xC, L.bot + 4);
      adsrCtx.stroke();
      adsrCtx.setLineDash([]);

      // Filled area under envelope
      adsrCtx.fillStyle = '#89b4fa14';
      adsrCtx.beginPath();
      adsrCtx.moveTo(p0.x, p0.y);
      adsrCtx.lineTo(p1.x, p1.y);
      adsrCtx.lineTo(p2.x, p2.y);
      adsrCtx.lineTo(p3.x, p3.y);
      adsrCtx.lineTo(p4.x, p4.y);
      adsrCtx.lineTo(p4.x, L.bot);
      adsrCtx.closePath();
      adsrCtx.fill();

      // Envelope line
      adsrCtx.strokeStyle = '#89b4fa';
      adsrCtx.lineWidth = 2;
      adsrCtx.lineJoin = 'round';
      adsrCtx.beginPath();
      adsrCtx.moveTo(p0.x, p0.y);
      adsrCtx.lineTo(p1.x, p1.y);
      adsrCtx.lineTo(p2.x, p2.y);
      adsrCtx.lineTo(p3.x, p3.y);
      adsrCtx.lineTo(p4.x, p4.y);
      adsrCtx.stroke();

      // Handles
      [p1, p2, p4].forEach(p => {
        const active = adsrDrag === p.id || adsrHover === p.id;
        adsrCtx.shadowColor = p.color;
        adsrCtx.shadowBlur  = active ? 14 : 5;
        adsrCtx.fillStyle   = p.color;
        adsrCtx.beginPath();
        adsrCtx.arc(p.x, p.y, active ? 8 : 6, 0, Math.PI * 2);
        adsrCtx.fill();
        adsrCtx.shadowBlur = 0;
      });

      // Value labels near handles
      adsrCtx.font = '9px Courier New';
      adsrCtx.textAlign = 'center';
      const valLbls = [
        [p1, env.attack.ms + 'ms'],
        [p2, env.decay.ms + 'ms · ' + Math.round(env.sustain.level * 100) + '%'],
        [p4, env.release.ms + 'ms'],
      ];
      valLbls.forEach(([p, txt]) => {
        adsrCtx.fillStyle = p.color + 'cc';
        const ly = p.y < L.top + 18 ? p.y + 16 : p.y - 11;
        adsrCtx.fillText(txt, Math.max(30, Math.min(L.W - 30, p.x)), ly);
      });
    }

    function adsrPointerPos(e) {
      const rect = adsrCanvas.getBoundingClientRect();
      return [
        (e.clientX - rect.left) * (adsrCanvas.offsetWidth  / rect.width),
        (e.clientY - rect.top)  * (adsrCanvas.offsetHeight / rect.height),
      ];
    }

    function hitTest(mx, my) {
      const L = layout();
      const { p1, p2, p4 } = handles(L);
      const R = 14;
      for (const p of [p1, p2, p4]) {
        if (Math.hypot(mx - p.x, my - p.y) < R) return p.id;
      }
      return null;
    }

    function applyDrag(id, mx, my) {
      const L = layout();
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      if (id === 'attack') {
        const t = clamp((mx - L.xA) / L.seg, 0, 1);
        env.attack.ms = fromT(t, env.attack.max, env.attack.min);
        if (synth) synth.set_attack(env.attack.ms / 1000);
        document.getElementById('av').textContent = env.attack.ms + 'ms';
      } else if (id === 'decay+sustain') {
        const tx = clamp((mx - L.xB) / L.seg, 0, 1);
        env.decay.ms = fromT(tx, env.decay.max, env.decay.min);
        const ty = clamp((my - L.top) / (L.bot - L.top), 0, 1);
        env.sustain.level = Math.round((1 - ty) * 100) / 100;
        if (synth) { synth.set_decay(env.decay.ms / 1000); synth.set_sustain(env.sustain.level); }
        document.getElementById('dv').textContent = env.decay.ms + 'ms';
        document.getElementById('sv').textContent = Math.round(env.sustain.level * 100) + '%';
      } else if (id === 'release') {
        const t = clamp((mx - L.xD) / L.seg, 0, 1);
        env.release.ms = fromT(t, env.release.max, env.release.min);
        if (synth) synth.set_release(env.release.ms / 1000);
        document.getElementById('rv').textContent = env.release.ms + 'ms';
      }
      drawADSR();
    }

    adsrCanvas.addEventListener('mousedown', e => {
      const [mx, my] = adsrPointerPos(e);
      adsrDrag = hitTest(mx, my);
      if (adsrDrag) { e.preventDefault(); applyDrag(adsrDrag, mx, my); }
    });

    window.addEventListener('mousemove', e => {
      const [mx, my] = adsrPointerPos(e);
      if (adsrDrag) { applyDrag(adsrDrag, mx, my); return; }
      const h = hitTest(mx, my);
      if (h !== adsrHover) {
        adsrHover = h;
        adsrCanvas.style.cursor = h ? 'grab' : 'default';
        drawADSR();
      }
    });

    window.addEventListener('mouseup', () => {
      if (adsrDrag) { adsrDrag = null; adsrCanvas.style.cursor = adsrHover ? 'grab' : 'default'; drawADSR(); }
    });

    adsrCanvas.addEventListener('touchstart', e => {
      const t = e.touches[0];
      const rect = adsrCanvas.getBoundingClientRect();
      const mx = (t.clientX - rect.left) * (adsrCanvas.offsetWidth / rect.width);
      const my = (t.clientY - rect.top)  * (adsrCanvas.offsetHeight / rect.height);
      adsrDrag = hitTest(mx, my);
      if (adsrDrag) { e.preventDefault(); applyDrag(adsrDrag, mx, my); }
    }, { passive: false });

    adsrCanvas.addEventListener('touchmove', e => {
      if (!adsrDrag) return;
      e.preventDefault();
      const t = e.touches[0];
      const rect = adsrCanvas.getBoundingClientRect();
      const mx = (t.clientX - rect.left) * (adsrCanvas.offsetWidth / rect.width);
      const my = (t.clientY - rect.top)  * (adsrCanvas.offsetHeight / rect.height);
      applyDrag(adsrDrag, mx, my);
    }, { passive: false });

    adsrCanvas.addEventListener('touchend', () => { adsrDrag = null; drawADSR(); });

    // Initial draw + redraw on resize
    drawADSR();
    new ResizeObserver(drawADSR).observe(adsrCanvas);

    // ── Knob (canvas-based rotary control, drag up to increase) ─────────
    class Knob {
      constructor(canvas, { min, max, value, color = '#89b4fa', log = false, onChange = () => {} }) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.min = min; this.max = max;
        this.color = color; this.log = log; this.onChange = onChange;
        this._norm = this._toNorm(value ?? min);
        this._drag = false; this._lastY = 0;
        this._bind(); this.draw();
      }

      _toNorm(v) {
        return this.log
          ? Math.log(v / this.min) / Math.log(this.max / this.min)
          : (v - this.min) / (this.max - this.min);
      }

      _fromNorm(n) {
        return this.log
          ? this.min * Math.pow(this.max / this.min, n)
          : this.min + n * (this.max - this.min);
      }

      get value() { return this._fromNorm(this._norm); }

      draw() {
        const c = this.canvas;
        const S = c.offsetWidth || 54;
        const dpr = window.devicePixelRatio || 1;
        if (c.width !== S * dpr) { c.width = c.height = S * dpr; this.ctx.scale(dpr, dpr); }
        const ctx = this.ctx, cx = S / 2, cy = S / 2, R = S / 2 - 5;
        const START = 0.75 * Math.PI, RANGE = 1.5 * Math.PI;
        const cur = START + this._norm * RANGE;
        ctx.clearRect(0, 0, S, S);

        ctx.beginPath();
        ctx.arc(cx, cy, R, START, START + RANGE);
        ctx.strokeStyle = '#313244'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, R, START, cur);
        ctx.strokeStyle = this.color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, R - 5, 0, Math.PI * 2);
        ctx.fillStyle = '#181825'; ctx.fill();
        ctx.strokeStyle = '#45475a'; ctx.lineWidth = 1; ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx + (R - 3) * Math.cos(cur), cy + (R - 3) * Math.sin(cur), 2.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color; ctx.fill();
      }

      _move(dy) {
        this._norm = Math.max(0, Math.min(1, this._norm - dy / 180));
        this.draw(); this.onChange(this.value);
      }

      _bind() {
        this.canvas.addEventListener('mousedown', e => {
          this._drag = true; this._lastY = e.clientY; e.preventDefault();
        });
        window.addEventListener('mousemove', e => {
          if (!this._drag) return;
          this._move(e.clientY - this._lastY); this._lastY = e.clientY;
        });
        window.addEventListener('mouseup', () => { this._drag = false; });

        this.canvas.addEventListener('touchstart', e => {
          this._drag = true; this._lastY = e.touches[0].clientY; e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchmove', e => {
          if (!this._drag) return;
          e.preventDefault(); this._move(e.touches[0].clientY - this._lastY); this._lastY = e.touches[0].clientY;
        }, { passive: false });
        window.addEventListener('touchend', () => { this._drag = false; });
      }
    }

    // ── Filter ──────────────────────────────────────────────────────────
    function fmtCutoff(hz) {
      return hz >= 1000 ? (hz / 1000).toFixed(1) + ' kHz' : Math.round(hz) + ' Hz';
    }

    const FLT_SR = 44100, FLT_FMIN = 20, FLT_FMAX = 20000;
    const DB_MIN = -48, DB_MAX = 30;

    function computeFilterCoeffs(type, cutoff, q) {
      const w0 = 2 * Math.PI * cutoff / FLT_SR;
      const sinw = Math.sin(w0), cosw = Math.cos(w0);
      const alpha = sinw / (2 * q);
      const a0 = 1 + alpha, a1 = -2 * cosw, a2 = 1 - alpha;
      let b0, b1, b2;
      if (type === 0)      { b0 = (1 - cosw) / 2; b1 =  1 - cosw;  b2 = b0; }
      else if (type === 1) { b0 = (1 + cosw) / 2; b1 = -(1 + cosw); b2 = b0; }
      else                 { b0 = sinw / 2;        b1 = 0;           b2 = -b0; }
      return { b0: b0/a0, b1: b1/a0, b2: b2/a0, a1: a1/a0, a2: a2/a0 };
    }

    function filterResponseDb(c, freq) {
      const w = 2 * Math.PI * freq / FLT_SR;
      const cw = Math.cos(w), sw = Math.sin(w), c2 = Math.cos(2*w), s2 = Math.sin(2*w);
      const nRe = c.b0 + c.b1*cw + c.b2*c2, nIm = -(c.b1*sw + c.b2*s2);
      const dRe = 1   + c.a1*cw + c.a2*c2, dIm = -(c.a1*sw + c.a2*s2);
      const mag = Math.sqrt(nRe*nRe + nIm*nIm) / Math.sqrt(dRe*dRe + dIm*dIm);
      return 20 * Math.log10(Math.max(mag, 1e-6));
    }

    const fltScopeCanvas = document.getElementById('flt-scope');
    const fltScopeCtx    = fltScopeCanvas.getContext('2d');

    function drawFilterScope() {
      const W = fltScopeCanvas.offsetWidth, H = fltScopeCanvas.offsetHeight;
      if (!W || !H) return;
      const dpr = window.devicePixelRatio || 1;
      if (fltScopeCanvas.width !== Math.round(W * dpr)) {
        fltScopeCanvas.width  = Math.round(W * dpr);
        fltScopeCanvas.height = Math.round(H * dpr);
        fltScopeCtx.scale(dpr, dpr);
      }
      const ctx = fltScopeCtx;
      const freqToX = f  => W * Math.log(f / FLT_FMIN) / Math.log(FLT_FMAX / FLT_FMIN);
      const dbToY   = db => H * (1 - (db - DB_MIN) / (DB_MAX - DB_MIN));

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#11111b';
      ctx.fillRect(0, 0, W, H);

      // dB grid
      ctx.font = '8px Courier New';
      [-48, -36, -24, -12, 0, 12].forEach(db => {
        const y = dbToY(db);
        ctx.strokeStyle = db === 0 ? '#2a2a3e' : '#1a1a2a';
        ctx.lineWidth = db === 0 ? 1.5 : 1;
        ctx.setLineDash(db === 0 ? [] : [3, 5]);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#45475a';
        ctx.textAlign = 'left';
        ctx.fillText(db + 'dB', 2, y - 2);
      });

      // frequency grid
      [50, 100, 200, 500, 1000, 2000, 5000, 10000].forEach(f => {
        const x = freqToX(f);
        ctx.strokeStyle = '#1a1a2a';
        ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        ctx.setLineDash([]);
      });
      ctx.fillStyle = '#45475a'; ctx.textAlign = 'center';
      [100, 1000, 10000].forEach(f => {
        ctx.fillText(f >= 1000 ? f/1000 + 'k' : f, freqToX(f), H - 2);
      });

      // cutoff marker
      const cx = freqToX(cutoffKnob.value);
      ctx.strokeStyle = '#cba6f733'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();

      // frequency response
      const coeffs = computeFilterCoeffs(fltTypeIdx, cutoffKnob.value, resKnob.value);

      // fill
      ctx.beginPath();
      for (let px = 0; px <= W; px++) {
        const f = FLT_FMIN * Math.pow(FLT_FMAX / FLT_FMIN, px / W);
        const y = Math.max(-4, Math.min(H + 4, dbToY(filterResponseDb(coeffs, f))));
        px === 0 ? ctx.moveTo(0, y) : ctx.lineTo(px, y);
      }
      ctx.lineTo(W, H + 4); ctx.lineTo(0, H + 4); ctx.closePath();
      ctx.fillStyle = '#cba6f720'; ctx.fill();

      // stroke
      ctx.beginPath();
      for (let px = 0; px <= W; px++) {
        const f = FLT_FMIN * Math.pow(FLT_FMAX / FLT_FMIN, px / W);
        const y = Math.max(-4, Math.min(H + 4, dbToY(filterResponseDb(coeffs, f))));
        px === 0 ? ctx.moveTo(0, y) : ctx.lineTo(px, y);
      }
      ctx.strokeStyle = '#cba6f7'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    }

    const fltTypes = ['LP', 'HP', 'BP'];
    let fltTypeIdx = 0;
    const fltTypeBtn = document.getElementById('flt-type');
    fltTypeBtn.addEventListener('click', () => {
      fltTypeIdx = (fltTypeIdx + 1) % 3;
      fltTypeBtn.textContent = fltTypes[fltTypeIdx];
      if (synth) synth.set_filter_type(fltTypeIdx);
      drawFilterScope();
    });

    const cutoffKnob = new Knob(document.getElementById('flt-cutoff-knob'), {
      min: 20, max: 20000, value: 20000, color: '#cba6f7', log: true,
      onChange: hz => {
        document.getElementById('flt-cutoff-val').textContent = fmtCutoff(hz);
        if (synth) synth.set_filter_cutoff(hz);
        drawFilterScope();
      },
    });
    document.getElementById('flt-cutoff-val').textContent = fmtCutoff(cutoffKnob.value);

    const resKnob = new Knob(document.getElementById('flt-res-knob'), {
      min: 0.1, max: 20, value: 0.707, color: '#cba6f7',
      onChange: q => {
        document.getElementById('flt-res-val').textContent = q.toFixed(2);
        if (synth) synth.set_filter_resonance(q);
        drawFilterScope();
      },
    });
    document.getElementById('flt-res-val').textContent = resKnob.value.toFixed(2);

    drawFilterScope();
    new ResizeObserver(drawFilterScope).observe(fltScopeCanvas);
  </script>
</body>
</html>
