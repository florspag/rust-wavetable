<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavetable Synth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #cdd6f4;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #89b4fa;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #status {
      font-size: 0.75rem;
      color: #6c7086;
      letter-spacing: 0.05em;
    }

    .panel {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      width: 100%;
      max-width: 720px;
    }

    .panel-title {
      font-size: 0.65rem;
      color: #585b70;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
    }

    /* Oscilloscope */
    #scope {
      display: block;
      width: 100%;
      height: 100px;
      border-radius: 4px;
      background: #11111b;
    }

    /* Waveform selector */
    .wf-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .wf-btn {
      flex: 1;
      padding: 0.55rem 0.25rem;
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 5px;
      color: #a6adc8;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .wf-btn:hover { background: #313244; color: #cdd6f4; }

    .wf-btn.active {
      background: #1e3a5f;
      border-color: #89b4fa;
      color: #89b4fa;
      font-weight: bold;
    }

    /* ADSR canvas */
    #adsr-canvas {
      display: block;
      width: 100%;
      height: 140px;
      border-radius: 4px;
      background: #11111b;
      cursor: default;
    }

    .adsr-vals {
      display: flex;
      justify-content: space-around;
      margin-top: 0.6rem;
      font-size: 0.7rem;
      color: #585b70;
    }

    .adsr-vals span { text-align: center; }
    .adsr-vals b { display: block; font-weight: normal; }

    /* Piano */
    .piano-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .piano {
      position: relative;
      display: flex;
      user-select: none;
      touch-action: none;
    }

    .white-key {
      width: 52px;
      height: 140px;
      background: linear-gradient(to bottom, #e8e8e8, #f5f5f5);
      border: 1px solid #aaa;
      border-top: none;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: background 0.05s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .white-key:hover { background: linear-gradient(to bottom, #d0deff, #e4ebff); }
    .white-key.active { background: linear-gradient(to bottom, #93c0ff, #b8d4ff); }

    .key-label {
      font-size: 0.6rem;
      color: #888;
      font-family: 'Courier New', monospace;
      pointer-events: none;
    }

    .white-key.active .key-label { color: #2255aa; }

    .black-key {
      position: absolute;
      width: 32px;
      height: 88px;
      background: linear-gradient(to bottom, #222, #333);
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      z-index: 2;
      top: 0;
      transition: background 0.05s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }

    .black-key:hover { background: linear-gradient(to bottom, #334, #445); }
    .black-key.active { background: linear-gradient(to bottom, #2255aa, #3366cc); }

    .black-key .key-label { color: #666; font-size: 0.55rem; }
    .black-key.active .key-label { color: #aaccff; }

    .note-display {
      font-size: 0.8rem;
      color: #89b4fa;
      letter-spacing: 0.05em;
      min-height: 1.2rem;
      text-align: center;
    }

    .key-hint {
      font-size: 0.65rem;
      color: #45475a;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Wavetable Synth</h1>
  <p id="status">Click a key to start audio...</p>

  <div class="panel">
    <div class="panel-title">Oscilloscope</div>
    <canvas id="scope"></canvas>
  </div>

  <div class="panel">
    <div class="panel-title">Waveform</div>
    <div class="wf-buttons">
      <button class="wf-btn active" data-idx="0">Sine</button>
      <button class="wf-btn"        data-idx="1">Sawtooth</button>
      <button class="wf-btn"        data-idx="2">Square</button>
      <button class="wf-btn"        data-idx="3">Triangle</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">ADSR Envelope — drag handles to edit</div>
    <canvas id="adsr-canvas"></canvas>
    <div class="adsr-vals">
      <span>A<b id="av">10ms</b></span>
      <span>D<b id="dv">150ms</b></span>
      <span>S<b id="sv">70%</b></span>
      <span>R<b id="rv">400ms</b></span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Keyboard — C4 to C5</div>
    <div class="piano-wrap">
      <div class="piano" id="piano"></div>
      <div class="note-display" id="note-display"></div>
      <div class="key-hint">Click keys or use keyboard: A W S E D F T G Y H U J K</div>
    </div>
  </div>

  <script type="module">
    import init, { Synth } from './pkg/rust_wavetable.js';

    // ── Piano layout ────────────────────────────────────────────────────
    // White keys: C4 D4 E4 F4 G4 A4 B4 C5  (MIDI 60-72)
    // Black keys: C#4 D#4 F#4 G#4 A#4      (MIDI 61,63,66,68,70)
    const WHITE_KEYS = [
      { midi: 60, label: 'A', name: 'C4' },
      { midi: 62, label: 'S', name: 'D4' },
      { midi: 64, label: 'D', name: 'E4' },
      { midi: 65, label: 'F', name: 'F4' },
      { midi: 67, label: 'G', name: 'G4' },
      { midi: 69, label: 'H', name: 'A4' },
      { midi: 71, label: 'J', name: 'B4' },
      { midi: 72, label: 'K', name: 'C5' },
    ];
    // left offset = left-edge of the black key in px (white key = 52px wide, black = 32px)
    const BLACK_KEYS = [
      { midi: 61, label: 'W', name: 'C#4', left: 36  },
      { midi: 63, label: 'E', name: 'D#4', left: 88  },
      { midi: 66, label: 'T', name: 'F#4', left: 192 },
      { midi: 68, label: 'Y', name: 'G#4', left: 244 },
      { midi: 70, label: 'U', name: 'A#4', left: 296 },
    ];

    const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const KEY_MAP = {
      'a':60,'w':61,'s':62,'e':63,'d':64,
      'f':65,'t':66,'g':67,'y':68,'h':69,
      'u':70,'j':71,'k':72
    };

    function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function midiName(m) {
      return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
    }

    // ── Build piano DOM ─────────────────────────────────────────────────
    const pianoEl = document.getElementById('piano');
    pianoEl.style.width = (52 * 8) + 'px';

    WHITE_KEYS.forEach(k => {
      const el = document.createElement('div');
      el.className = 'white-key';
      el.dataset.midi = k.midi;
      el.innerHTML = `<span class="key-label">${k.label}</span>`;
      pianoEl.appendChild(el);
    });

    BLACK_KEYS.forEach(k => {
      const el = document.createElement('div');
      el.className = 'black-key';
      el.dataset.midi = k.midi;
      el.style.left = k.left + 'px';
      el.innerHTML = `<span class="key-label">${k.label}</span>`;
      pianoEl.appendChild(el);
    });

    // ── Waveform shapes (for oscilloscope preview) ───────────────────────
    const WAVE_FNS = [
      t => Math.sin(2 * Math.PI * t),
      t => 2 * t - 1,
      t => t < 0.5 ? 1 : -1,
      t => 1 - 4 * Math.abs(t - 0.5),
    ];

    let activeWave = 0;
    let isPlaying = false;
    let scopeOffset = 0;

    // ── Oscilloscope ────────────────────────────────────────────────────
    const scopeCanvas = document.getElementById('scope');
    const scopeCtx = scopeCanvas.getContext('2d');

    function drawScope() {
      const W = scopeCanvas.offsetWidth;
      const H = scopeCanvas.offsetHeight;
      if (scopeCanvas.width !== W || scopeCanvas.height !== H) {
        scopeCanvas.width = W;
        scopeCanvas.height = H;
      }

      scopeCtx.fillStyle = '#11111b';
      scopeCtx.fillRect(0, 0, W, H);

      // centre line
      scopeCtx.strokeStyle = '#1e1e2e';
      scopeCtx.lineWidth = 1;
      scopeCtx.beginPath();
      scopeCtx.moveTo(0, H / 2);
      scopeCtx.lineTo(W, H / 2);
      scopeCtx.stroke();

      // waveform
      scopeCtx.strokeStyle = isPlaying ? '#89b4fa' : '#313244';
      scopeCtx.lineWidth = 2;
      scopeCtx.beginPath();
      const cycles = 3;
      for (let x = 0; x <= W; x++) {
        const t = ((x / W) * cycles + scopeOffset) % 1;
        const amp = WAVE_FNS[activeWave](t);
        const y = H / 2 - amp * (H / 2 - 6);
        x === 0 ? scopeCtx.moveTo(x, y) : scopeCtx.lineTo(x, y);
      }
      scopeCtx.stroke();

      if (isPlaying) scopeOffset = (scopeOffset + 0.004) % 1;
      requestAnimationFrame(drawScope);
    }
    drawScope();

    // ── Audio engine ────────────────────────────────────────────────────
    let synth = null;
    let audioCtx = null;
    let processor = null;
    const statusEl = document.getElementById('status');
    const noteDisplay = document.getElementById('note-display');

    async function startAudio() {
      if (audioCtx) return;
      statusEl.textContent = 'Loading WASM...';
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
      await init();
      synth = new Synth(audioCtx.sampleRate);

      // ScriptProcessorNode — calls into WASM for each sample
      processor = audioCtx.createScriptProcessor(256, 0, 1);
      processor.onaudioprocess = e => {
        const out = e.outputBuffer.getChannelData(0);
        for (let i = 0; i < out.length; i++) out[i] = synth.tick();
      };
      processor.connect(audioCtx.destination);
      statusEl.textContent = 'Ready';
    }

    // ── Key interaction ─────────────────────────────────────────────────
    let activeNote = null;

    function noteOn(midi) {
      startAudio().then(() => {
        if (!synth) return;
        activeNote = midi;
        synth.note_on(midiFreq(midi));
        isPlaying = true;
        noteDisplay.textContent = `${midiName(midi)}  ·  ${midiFreq(midi).toFixed(1)} Hz`;
        document.querySelectorAll('[data-midi]').forEach(el => {
          el.classList.toggle('active', parseInt(el.dataset.midi) === midi);
        });
      });
    }

    function noteOff(midi) {
      if (activeNote !== midi) return;
      if (synth) { synth.note_off(); isPlaying = false; }
      activeNote = null;
      noteDisplay.textContent = '';
      document.querySelectorAll('[data-midi]').forEach(el => el.classList.remove('active'));
    }

    // Piano mouse events
    pianoEl.addEventListener('pointerdown', e => {
      const key = e.target.closest('[data-midi]');
      if (!key) return;
      e.preventDefault();
      key.setPointerCapture(e.pointerId);
      noteOn(parseInt(key.dataset.midi));
    });

    pianoEl.addEventListener('pointerup', e => {
      const key = e.target.closest('[data-midi]');
      if (key) noteOff(parseInt(key.dataset.midi));
    });

    pianoEl.addEventListener('pointerleave', () => {
      if (activeNote !== null) noteOff(activeNote);
    });

    // Keyboard events
    const heldKeys = new Set();
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      const midi = KEY_MAP[e.key.toLowerCase()];
      if (midi === undefined) return;
      heldKeys.add(e.key.toLowerCase());
      noteOn(midi);
    });

    document.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      const midi = KEY_MAP[k];
      if (midi === undefined) return;
      heldKeys.delete(k);
      noteOff(midi);
    });

    // ── Waveform buttons ────────────────────────────────────────────────
    document.querySelectorAll('.wf-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeWave = parseInt(btn.dataset.idx);
        document.querySelectorAll('.wf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (synth) synth.set_waveform(activeWave);
      });
    });

    // ── ADSR interactive canvas ─────────────────────────────────────────
    const adsrCanvas = document.getElementById('adsr-canvas');
    const adsrCtx = adsrCanvas.getContext('2d');

    // Current ADSR state (ms / 0-1 level)
    const env = {
      attack:  { ms: 10,  max: 2000, min: 5 },
      decay:   { ms: 150, max: 3000, min: 5 },
      sustain: { level: 0.7 },
      release: { ms: 400, max: 5000, min: 5 },
    };

    // sqrt scale → short values stay easy to grab
    function toT(ms, max)      { return Math.sqrt(ms / max); }
    function fromT(t, max, min){ return Math.max(min, Math.round(t * t * max)); }

    // CSS-pixel layout (width adapts, height is fixed)
    function layout() {
      const W = adsrCanvas.offsetWidth;
      const H = 140;
      const px = 14, py = 22;
      const usable = W - 2 * px;
      const seg = usable / 4;
      return {
        W, H, px, py,
        top: py, bot: H - py, seg,
        xA: px,             // attack seg start
        xB: px + seg,       // decay  seg start
        xC: px + seg * 2,   // hold   seg start  (note-off line)
        xD: px + seg * 3,   // release seg start
        xE: px + seg * 4,   // end
      };
    }

    // The three draggable handle positions (CSS px)
    function handles(L) {
      const amp = L.bot - L.top;
      return {
        p1: { x: L.xA + toT(env.attack.ms,  env.attack.max)  * L.seg, y: L.top,                                     id: 'attack',        color: '#a6e3a1' },
        p2: { x: L.xB + toT(env.decay.ms,   env.decay.max)   * L.seg, y: L.top + (1 - env.sustain.level) * amp,     id: 'decay+sustain', color: '#f9e2af' },
        p4: { x: L.xD + toT(env.release.ms, env.release.max) * L.seg, y: L.bot,                                     id: 'release',       color: '#f38ba8' },
      };
    }

    let adsrHover = null, adsrDrag = null;

    function drawADSR() {
      const L = layout();
      // Resize backing buffer to match CSS size × DPR
      const dpr = window.devicePixelRatio || 1;
      if (adsrCanvas.width !== Math.round(L.W * dpr)) {
        adsrCanvas.width  = Math.round(L.W * dpr);
        adsrCanvas.height = Math.round(L.H * dpr);
        adsrCtx.scale(dpr, dpr);
      }

      const { p1, p2, p4 } = handles(L);
      const p0 = { x: L.xA, y: L.bot };
      const p3 = { x: L.xC, y: p2.y  }; // note-off = start of release

      adsrCtx.clearRect(0, 0, L.W, L.H);
      adsrCtx.fillStyle = '#11111b';
      adsrCtx.fillRect(0, 0, L.W, L.H);

      // Segment tint bands
      const bands = ['#a6e3a108','#f9e2af08','#cba6f708','#f38ba808'];
      bands.forEach((c, i) => {
        adsrCtx.fillStyle = c;
        adsrCtx.fillRect(L.xA + L.seg * i, L.top - 4, L.seg, L.bot - L.top + 8);
      });

      // Segment labels (top)
      const lbls = [['A','#a6e3a1'],['D','#f9e2af'],['S','#cba6f7'],['R','#f38ba8']];
      adsrCtx.font = '10px Courier New';
      adsrCtx.textAlign = 'center';
      lbls.forEach(([t, c], i) => {
        adsrCtx.fillStyle = c;
        adsrCtx.fillText(t, L.xA + L.seg * i + L.seg / 2, L.top - 8);
      });

      // Segment dividers
      adsrCtx.strokeStyle = '#2a2a3e';
      adsrCtx.lineWidth = 1;
      [L.xB, L.xC, L.xD].forEach(x => {
        adsrCtx.beginPath();
        adsrCtx.moveTo(x, L.top - 4);
        adsrCtx.lineTo(x, L.bot + 4);
        adsrCtx.stroke();
      });

      // Note-off marker (dashed, at xC)
      adsrCtx.setLineDash([3, 4]);
      adsrCtx.strokeStyle = '#45475a';
      adsrCtx.lineWidth = 1;
      adsrCtx.beginPath();
      adsrCtx.moveTo(L.xC, L.top - 4);
      adsrCtx.lineTo(L.xC, L.bot + 4);
      adsrCtx.stroke();
      adsrCtx.setLineDash([]);

      // Filled area under envelope
      adsrCtx.fillStyle = '#89b4fa14';
      adsrCtx.beginPath();
      adsrCtx.moveTo(p0.x, p0.y);
      adsrCtx.lineTo(p1.x, p1.y);
      adsrCtx.lineTo(p2.x, p2.y);
      adsrCtx.lineTo(p3.x, p3.y);
      adsrCtx.lineTo(p4.x, p4.y);
      adsrCtx.lineTo(p4.x, L.bot);
      adsrCtx.closePath();
      adsrCtx.fill();

      // Envelope line
      adsrCtx.strokeStyle = '#89b4fa';
      adsrCtx.lineWidth = 2;
      adsrCtx.lineJoin = 'round';
      adsrCtx.beginPath();
      adsrCtx.moveTo(p0.x, p0.y);
      adsrCtx.lineTo(p1.x, p1.y);
      adsrCtx.lineTo(p2.x, p2.y);
      adsrCtx.lineTo(p3.x, p3.y);
      adsrCtx.lineTo(p4.x, p4.y);
      adsrCtx.stroke();

      // Handles
      [p1, p2, p4].forEach(p => {
        const active = adsrDrag === p.id || adsrHover === p.id;
        adsrCtx.shadowColor = p.color;
        adsrCtx.shadowBlur  = active ? 14 : 5;
        adsrCtx.fillStyle   = p.color;
        adsrCtx.beginPath();
        adsrCtx.arc(p.x, p.y, active ? 8 : 6, 0, Math.PI * 2);
        adsrCtx.fill();
        adsrCtx.shadowBlur = 0;
      });

      // Value labels near handles
      adsrCtx.font = '9px Courier New';
      adsrCtx.textAlign = 'center';
      const valLbls = [
        [p1, env.attack.ms + 'ms'],
        [p2, env.decay.ms + 'ms · ' + Math.round(env.sustain.level * 100) + '%'],
        [p4, env.release.ms + 'ms'],
      ];
      valLbls.forEach(([p, txt]) => {
        adsrCtx.fillStyle = p.color + 'cc';
        const ly = p.y < L.top + 18 ? p.y + 16 : p.y - 11;
        adsrCtx.fillText(txt, Math.max(30, Math.min(L.W - 30, p.x)), ly);
      });
    }

    function adsrPointerPos(e) {
      const rect = adsrCanvas.getBoundingClientRect();
      return [
        (e.clientX - rect.left) * (adsrCanvas.offsetWidth  / rect.width),
        (e.clientY - rect.top)  * (adsrCanvas.offsetHeight / rect.height),
      ];
    }

    function hitTest(mx, my) {
      const L = layout();
      const { p1, p2, p4 } = handles(L);
      const R = 14;
      for (const p of [p1, p2, p4]) {
        if (Math.hypot(mx - p.x, my - p.y) < R) return p.id;
      }
      return null;
    }

    function applyDrag(id, mx, my) {
      const L = layout();
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      if (id === 'attack') {
        const t = clamp((mx - L.xA) / L.seg, 0, 1);
        env.attack.ms = fromT(t, env.attack.max, env.attack.min);
        if (synth) synth.set_attack(env.attack.ms / 1000);
        document.getElementById('av').textContent = env.attack.ms + 'ms';
      } else if (id === 'decay+sustain') {
        const tx = clamp((mx - L.xB) / L.seg, 0, 1);
        env.decay.ms = fromT(tx, env.decay.max, env.decay.min);
        const ty = clamp((my - L.top) / (L.bot - L.top), 0, 1);
        env.sustain.level = Math.round((1 - ty) * 100) / 100;
        if (synth) { synth.set_decay(env.decay.ms / 1000); synth.set_sustain(env.sustain.level); }
        document.getElementById('dv').textContent = env.decay.ms + 'ms';
        document.getElementById('sv').textContent = Math.round(env.sustain.level * 100) + '%';
      } else if (id === 'release') {
        const t = clamp((mx - L.xD) / L.seg, 0, 1);
        env.release.ms = fromT(t, env.release.max, env.release.min);
        if (synth) synth.set_release(env.release.ms / 1000);
        document.getElementById('rv').textContent = env.release.ms + 'ms';
      }
      drawADSR();
    }

    adsrCanvas.addEventListener('mousedown', e => {
      const [mx, my] = adsrPointerPos(e);
      adsrDrag = hitTest(mx, my);
      if (adsrDrag) { e.preventDefault(); applyDrag(adsrDrag, mx, my); }
    });

    window.addEventListener('mousemove', e => {
      const [mx, my] = adsrPointerPos(e);
      if (adsrDrag) { applyDrag(adsrDrag, mx, my); return; }
      const h = hitTest(mx, my);
      if (h !== adsrHover) {
        adsrHover = h;
        adsrCanvas.style.cursor = h ? 'grab' : 'default';
        drawADSR();
      }
    });

    window.addEventListener('mouseup', () => {
      if (adsrDrag) { adsrDrag = null; adsrCanvas.style.cursor = adsrHover ? 'grab' : 'default'; drawADSR(); }
    });

    adsrCanvas.addEventListener('touchstart', e => {
      const t = e.touches[0];
      const rect = adsrCanvas.getBoundingClientRect();
      const mx = (t.clientX - rect.left) * (adsrCanvas.offsetWidth / rect.width);
      const my = (t.clientY - rect.top)  * (adsrCanvas.offsetHeight / rect.height);
      adsrDrag = hitTest(mx, my);
      if (adsrDrag) { e.preventDefault(); applyDrag(adsrDrag, mx, my); }
    }, { passive: false });

    adsrCanvas.addEventListener('touchmove', e => {
      if (!adsrDrag) return;
      e.preventDefault();
      const t = e.touches[0];
      const rect = adsrCanvas.getBoundingClientRect();
      const mx = (t.clientX - rect.left) * (adsrCanvas.offsetWidth / rect.width);
      const my = (t.clientY - rect.top)  * (adsrCanvas.offsetHeight / rect.height);
      applyDrag(adsrDrag, mx, my);
    }, { passive: false });

    adsrCanvas.addEventListener('touchend', () => { adsrDrag = null; drawADSR(); });

    // Initial draw + redraw on resize
    drawADSR();
    new ResizeObserver(drawADSR).observe(adsrCanvas);
  </script>
</body>
</html>
